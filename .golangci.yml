version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
  exclusions:
    rules:
      # Tests build files and servers with throwaway permissions and paths.
      - path: _test\.go
        linters:
          - gosec
      # The fake server is test scaffolding: it redirects to its own base URL by design.
      - path: internal/testutil/
        linters:
          - gosec
      # The Win32 version-resource API takes and hands back raw pointers: unsafe is its interface.
      - path: internal/peversion/peversion_windows.go
        linters:
          - gosec
        text: G103
      # The engine works on paths by design: the install folder the package file names, and paths
      # under the state directory built from validated package names. Every path read back from
      # a journal, manifest or state file is validated (paths.ValidRel) before it is used.
      - path: internal/engine/
        linters:
          - gosec
        text: G703

formatters:
  enable:
    - gofmt
