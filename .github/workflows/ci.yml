name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Same shell on both OSes: PowerShell splits `-coverprofile=coverage.out` at the dot.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is the server's OS. Every job is pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test (race detector, no cache)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

  lint:
    name: lint and static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint (staticcheck, errcheck, gosec, ...)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          # Build the linter with the same toolchain as the project: a prebuilt binary refuses to
          # analyze code that targets a newer Go than the one it was built with.
          install-mode: goinstall

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary is run directly rather than through gitleaks-action: the action builds a
      # "<first commit>^..HEAD" range, which fails on a repository whose first push has a root
      # commit. The expected hash is pinned here, not fetched alongside the download.
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose --no-banner .

  # A single required check for branch protection, so the matrix can change without
  # touching the protection rule.
  ci-ok:
    name: CI passed
    if: always()
    needs: [test, lint, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any job failed or was canceled
        run: |
          echo "test=${{ needs.test.result }} lint=${{ needs.lint.result }} secrets=${{ needs.secrets.result }}"
          test "${{ needs.test.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.secrets.result }}" = success
